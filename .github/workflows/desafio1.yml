name: desafio 1

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Digite a imagem do docker que deseja baixar'
        required: true
        default: 'python'

jobs:
  pullDockerImage:
    runs-on: ubuntu-latest
    steps:
      - name: pull docker imagem
        run: docker pull ${{ github.event.inputs.image }} && docker image ls
      - name: Docker Scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ github.event.inputs.image }}
          summary: true

